name: Rust tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install nightly Rust for branch coverage
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run instrumented tests
        run: cargo +nightly llvm-cov --branch --locked --workspace --all-features --no-report
      - name: Generate coverage reports
        run: |
          cargo +nightly llvm-cov report --branch | tee coverage-summary.txt
          cargo +nightly llvm-cov report --branch --html --output-dir coverage-html
          cargo +nightly llvm-cov report --branch --json --output-path coverage.json
      - name: Add coverage to job summary
        run: |
          {
            echo '## Rust code coverage'
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce line coverage baseline
        run: cargo +nightly llvm-cov report --branch --fail-under-lines 85
      - name: Require branch coverage above 80 percent
        run: jq -e '.data[0].totals.branches | .count > 0 and (.covered * 5 > .count * 4)' coverage.json
      - name: Upload detailed coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-report
          path: |
            coverage-summary.txt
            coverage.json
            coverage-html/
          if-no-files-found: error
          retention-days: 14
